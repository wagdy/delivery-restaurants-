services:
  sqlserver:
    # azure-sql-edge (not the full mssql/server image) - it has an arm64 build, so this
    # runs natively on Apple Silicon without Rosetta emulation. Same T-SQL surface as
    # Azure SQL Database for local dev purposes.
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: restaurant-delivery-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev@2026"
    ports:
      # Host 1433 and 14330 are already taken by other local SQL Server containers on
      # this machine - 14332 is this project's own port.
      - "14332:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # azure-sql-edge doesn't ship mssql-tools/sqlcmd, so this checks the port directly
      # rather than running a real query.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1433' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sqlserver_data:
