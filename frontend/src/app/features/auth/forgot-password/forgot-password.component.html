<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-content>
      <mat-icon class="placeholder-icon">lock_reset</mat-icon>
      <h2>Forgot / Change Password?</h2>
      <p class="placeholder-text">
        Password reset isn't available yet. In the meantime, contact our team and we'll help you regain access to
        your account.
      </p>
    </mat-card-content>

    <mat-card-actions class="actions">
      <a mat-button routerLink="/login">Back to Login</a>
    </mat-card-actions>
  </mat-card>
</div>
