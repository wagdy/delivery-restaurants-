server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # index.html and the Angular service worker files must never be cached, or clients
    # get stuck on a stale build and the service worker never detects there's an update.
    # These are exact-match locations, so they're matched before the regex rule below
    # regardless of file order.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }

    # Long-lived caching for hashed build output (main-XXXX.js, chunk-XXXX.css, ...) -
    # outputHashing:"all" in angular.json means a new deploy always ships new filenames.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular's Router uses the HTML5 History API - any path that isn't a real static
    # file falls back to index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
